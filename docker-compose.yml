services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: navigate
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"
    # En producción, define VITE_APP_URL con tu dominio real (ej.
    # https://navigate.tu-universidad.edu) para que los QRs generados
    # apunten ahí y no a la URL desde donde abriste el panel admin.
    # environment:
    #   VITE_APP_URL: https://tu-dominio-real.com
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data: